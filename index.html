<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F3F0E8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Muscu" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />

<title>Muscu maison</title>
<style>
:root{--bg:#F3F0E8;--card:#fff;--fg:#15171F;--muted:#6B6E78;--accent:#FF5B2E;--soft:#E7E2D6;--mat:#DCE3F0;--ok:#2BB673;
--shadow:0 20px 50px rgba(30,30,60,.09),0 4px 12px rgba(30,30,60,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 120px}
h1,h2,.display{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:40px;line-height:1;font-weight:800}
h2{font-size:24px;font-weight:800;margin:28px 0 12px}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.pill{display:inline-block;padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;background:var(--soft)}
.pill.a{background:var(--accent);color:#fff}
.pill.g{background:#DFF5E9;color:#167A48}
button{font:inherit;border:0;cursor:pointer}
.btn{display:block;width:100%;padding:18px;border-radius:18px;font-weight:700;font-size:18px;background:var(--fg);color:#fff}
.btn.a{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--soft)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--soft);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:170px;background:none;padding:10px;border-radius:14px;font-weight:600;color:var(--muted);font-size:14px}
.tabs button.on{color:var(--fg);background:var(--soft)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{border-radius:14px;padding:10px 0;text-align:center;font-size:12px;font-weight:700;background:var(--card);box-shadow:var(--shadow)}
.day.w{background:var(--accent);color:#fff}
.day.today{outline:3px solid var(--fg);outline-offset:2px}
.day small{display:block;font-weight:500;opacity:.75;margin-top:2px;font-size:10px}
.exo{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--soft)}
.exo:last-child{border:0}
.exo .fig{width:86px;flex-shrink:0}
.exo b{display:block;font-size:16px}
.exo span{font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:11px;background:none;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.tip{display:flex;gap:10px;font-size:16px;line-height:1.35;margin:6px 0}
.tip:before{content:"→";color:var(--accent);font-weight:800}
/* séance */
.top{display:flex;gap:6px;margin-bottom:14px}
.top i{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.top i.d{background:var(--fg)}.top i.c{background:var(--accent)}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0}
.stepper button{width:64px;height:64px;border-radius:50%;background:var(--soft);font-size:32px;font-weight:700;color:var(--fg)}
.stepper .n{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:88px;font-weight:800;color:var(--accent);min-width:120px;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.range{display:flex;gap:3px;margin-top:6px}
.range i{flex:1;height:10px;border-radius:3px;background:var(--soft)}
.range i.on{background:var(--accent)}.range i.min{background:var(--fg)}
.ring{position:relative;width:250px;height:250px;margin:20px auto}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-weight:800;font-size:64px;font-variant-numeric:tabular-nums}
input[type=number],input[type=text]{font:inherit;font-size:18px;padding:14px;border-radius:14px;border:2px solid var(--soft);width:100%;background:var(--card)}
.banner{background:#FFE3D8;border-radius:18px;padding:14px 16px;font-weight:600;margin-top:12px;line-height:1.35}
.hist{padding:14px 0;border-bottom:1px solid var(--soft)}
.hist:last-child{border:0}
.small{font-size:13px}
.status{font-size:12px;margin-top:20px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(21,23,31,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .card{width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
</style>
</head>

 b:{head:[112,296],neck:[152,315],hip:[300,380],kN:[385,407],fN:[470,436],kF:[392,412],fF:[478,440],eN:[158,438],hN:[214,440],eF:[226,340],hF:[288,364]},
 work:['torso'],period:4},

 tips:['Penché à 45°, dos plat, sac tenu à deux mains','Tire le sac vers le nombril, serre les omoplates'],
 progress:'Ajoute 0,5 L d’eau dans le sac.',

tirage:{name:'Tirage à l’élastique (porte)',min:10,max:15,rest:60,muscles:'Dos (largeur) · Biceps',

ecarte:{name:'Écarté à l’élastique',min:15,max:20,rest:60,muscles:'Haut du dos · Arrière d’épaules',

 progress:'Prends la bande plus courte (mains plus rapprochées).',

 work:['armN','armF','torso'],prop:'band',view:'front',period:2.4},

 tips:['2 haltères de 3 kg par main (6 kg)','Coudes collés au corps, ne te balance pas'],

 progress:'Ajoute 0,5 L d’eau dans le sac.',
 a:{...STAND,eN:[306,218],hN:[314,288]},
 b:{head:[444,196],neck:[404,214],hip:[252,282],kN:[302,362],fN:[318,440],kF:[284,362],fF:[288,440],eN:[404,280],hN:[402,348]},
 work:['legN','legF','torso'],prop:'bagHang',period:3},
rotation:{name:'Rotation à l’élastique',min:10,max:12,per:'côté',rest:45,muscles:'Obliques · Taille',
 tips:['Élastique dans la porte, sur le côté, bras tendus','Tourne le buste, et freine le retour : c’est là que les obliques bossent'],
 progress:'Écarte-toi de la porte pour tendre plus l’élastique.',
 a:{...FRONT,eN:[380,190],hN:[430,198],eF:[372,196],hF:[424,204]},b:{...FRONT,eN:[232,192],hN:[184,206],eF:[240,198],hF:[192,212]},
 work:['torso'],prop:'bandSide',view:'front',period:2.6},
deadbug:{name:'Dead bug',min:8,max:12,per:'côté',rest:45,muscles:'Abdos profonds',

Object.entries(X).forEach(([id,e])=>e.id=id);

/* ---------- Séances ---------- */
const SESSIONS={
 A:{name:'Séance A',sub:'Pecs · Épaules · Triceps · Abdos',list:[['pompes',4],['dev',3],['ecarteSol',3],['lat',3],['triceps',3],['crunch',3],['planche',3]]},
 B:{name:'Séance B',sub:'Dos · Biceps · Jambes · Obliques',list:[['rowing',4],['tirage',3],['ecarte',3],['curl',3],['squat',3],['sdt',3],['rotation',3],['deadbug',2]]},
};
const WEEK=[ // index = getDay()
 {d:'Dim',s:null,t:'Piscine ou repos, et 8 000 pas'},
 {d:'Lun',s:'A'},{d:'Mar',s:'B'},
 {d:'Mer',s:null,t:'Piscine, et 8 000 pas'},
 {d:'Jeu',s:'A'},{d:'Ven',s:'B'},
 {d:'Sam',s:null,t:'Piscine, et 8 000 pas'},
];

/* ---------- Personnage SVG ---------- */
const C={skin:'#E9B48E',skinF:'#C98D69',tee:'#262B40',teeF:'#3A4060',sh:'#4C63E0',shF:'#3549B0',shoe:'#15171F',hair:'#2A211C',acc:'#FF5B2E',mat:'#DCE3F0',band:'#2BB673',ink:'#15171F'};
const L=(a,b,t)=>a+(b-a)*t, LP=(a,b,t)=>[L(a[0],b[0],t),L(a[1],b[1],t)], ad=(p,d)=>[p[0]+d[0],p[1]+d[1]];
const cap=(a,b,w,c,o=1)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${o}"/>`;
const db=(p)=>`<g><rect x="${p[0]-24}" y="${p[1]-7}" width="48" height="14" rx="7" fill="${C.ink}"/><rect x="${p[0]-28}" y="${p[1]-14}" width="12" height="28" rx="5" fill="${C.ink}"/><rect x="${p[0]+16}" y="${p[1]-14}" width="12" height="28" rx="5" fill="${C.ink}"/></g>`;
function figSVG(e,t){
 const front=e.view==='front';
 const p=(k,fb)=>{const A=e.a[k]||ad(e.a[fb],[-14,-4]),B=e.b[k]||ad(e.b[fb],[-14,-4]);return LP(A,B,t)};
 const head=p('head'),neck=p('neck'),hip=p('hip');
 const J={eN:p('eN'),hN:p('hN'),eF:p('eF','eN'),hF:p('hF','hN'),kN:p('kN'),fN:p('fN'),kF:p('kF','kN'),fF:p('fF','fN')};
 const dx=head[0]-neck[0],dy=head[1]-neck[1],l=Math.hypot(dx,dy)||1,up=[dx/l,dy/l];
 const shN=front?ad(neck,[40,12]):ad(neck,[-up[0]*8,-up[1]*8]),shF=front?ad(neck,[-40,12]):shN;
 const hpN=front?ad(hip,[20,0]):hip,hpF=front?ad(hip,[-20,0]):hip;
 const w=new Set(e.work),go=.25+.45*t;
 const halo=(s,pts,wd)=>w.has(s)?`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${C.acc}" stroke-width="${wd+22}" stroke-linecap="round" stroke-linejoin="round" opacity="${go}"/>`:'';
 const leg=(h,k,f,far)=>cap(k,f,30,far?C.skinF:C.skin)+cap(h,k,42,far?C.skinF:C.skin)+cap(h,LP(h,k,.62),46,far?C.shF:C.sh)+`<ellipse cx="${f[0]+(front?0:10)}" cy="${f[1]+4}" rx="${front?18:26}" ry="13" fill="${C.shoe}"/>`;
 const arm=(s,el,h,far)=>cap(el,h,24,far?C.skinF:C.skin)+cap(s,el,28,far?C.skinF:C.skin)+cap(s,LP(s,el,.45),34,far?C.teeF:C.tee)+`<circle cx="${h[0]}" cy="${h[1]}" r="14" fill="${far?C.skinF:C.skin}"/>`;
 let pre='',post='';
 const pr=e.prop;
 if(pr==='bagHang'){const[x,y]=J.hN;post=`<path d="M ${x-14} ${y+26} Q ${x} ${y-8} ${x+14} ${y+26}" stroke="#8C7550" stroke-width="6" fill="none"/><rect x="${x-34}" y="${y+22}" width="68" height="74" rx="12" fill="#D9C49A"/><rect x="${x-34}" y="${y+22}" width="68" height="14" rx="7" fill="#C7AF82"/>`}
 if(pr==='bagHold'){const[x,y]=J.hN;post=`<rect x="${x-34}" y="${y-10}" width="70" height="84" rx="14" fill="#D9C49A" stroke="#C7AF82" stroke-width="6"/>`}
 if(pr==='dbs'){post=db(J.hN)+(front||e.id==='ecarteSol'||e.id==='curl'?db(J.hF):'')}
 if(pr==='kb'){const[x,y]=LP(J.hN,J.hF,.5);post=`<circle cx="${x}" cy="${y-30}" r="24" fill="${C.ink}"/><path d="M ${x-14} ${y-46} Q ${x} ${y-72} ${x+14} ${y-46}" stroke="${C.ink}" stroke-width="7" fill="none"/>`}
 if(pr==='band'){const s=Math.hypot(J.hN[0]-J.hF[0],J.hN[1]-J.hF[1]);post=cap(J.hF,J.hN,Math.max(8,16-8*(s-60)/280),C.band)}
 if(pr==='bandPress'){post=cap(J.fN,J.hN,8,C.band)+cap(J.fF,J.hF,8,C.band)}
 if(pr==='bandDoor'){pre=`<rect x="540" y="30" width="16" height="420" rx="4" fill="#E7E2D6"/>`;post=cap(J.hN,[544,196],9,C.band)}
 if(pr==='bandSide'){pre=`<rect x="540" y="30" width="16" height="420" rx="4" fill="#E7E2D6"/>`;post=cap(J.hN,[544,200],9,C.band)}
 const xs=[head[0],hip[0],J.fN[0],J.fF[0],J.hN[0],J.hF[0]],mn=Math.min(...xs),mx=Math.max(...xs);
 const hair=ad(head,[up[0]*8-(front?0:6),up[1]*8]);
 const tw=front?84:66;
 return `<svg viewBox="0 0 560 480" width="100%" style="display:block;overflow:visible">
<rect x="20" y="448" width="520" height="18" rx="9" fill="${C.mat}"/>${pre}
<ellipse cx="${(mn+mx)/2}" cy="452" rx="${(mx-mn)/2+30}" ry="8" fill="#1E2240" opacity=".08"/>
${halo('legF',[hpF,J.kF,J.fF],40)}${halo('armF',[shF,J.eF,J.hF],28)}${halo('torso',[hip,neck],tw)}${halo('legN',[hpN,J.kN,J.fN],40)}${halo('armN',[shN,J.eN,J.hN],28)}

}
function finishSet(){
 const st=cur();
 (RUN.results[st.e.id]=RUN.results[st.e.id]||[]).push(RUN.val);
 beep(990,.15,.2);buzz(80);RUN.val=null;
 if(RUN.i===RUN.steps.length-1)return endRun();
 RUN.i++;
 if(st.side&&!st.lastSide)startRest(10,true);else startRest(st.e.rest,false);
}
function startRest(sec,switching){
 RUN.phase='rest';RUN.switching=switching;RUN.restTotal=sec;RUN.restEnd=Date.now()+sec*1000;RUN.lastBeep=null;
 clearInterval(timerId);
 timerId=setInterval(()=>{const left=Math.ceil((RUN.restEnd-Date.now())/1000);
  if(left<=3&&left>0&&RUN.lastBeep!==left){RUN.lastBeep=left;beep(880,.12,.25);buzz(40)}
  if(left<=0)return endRest(true);renderRun($('#app'))},250);
 renderRun($('#app'));
}
function endRest(go){clearInterval(timerId);if(go){beep(1320,.25,.3);buzz([80,60,80])}RUN.phase='work';renderRun($('#app'))}
function record(partial){S.sessions.push({id:'s'+Date.now(),date:new Date().toISOString(),sess:RUN.k,results:RUN.results,partial});saveSessions()}
function endRun(){clearInterval(timerId);keepAwake(false);record(false);RUN.phase='end';renderRun($('#app'))}
function showQuit(){
 $('#modal').innerHTML=`<div class="modal"><div class="card"><h2 style="margin-top:0">Arrêter la séance ?</h2><p class="muted">Les séries déjà faites seront enregistrées.</p>
 <button class="btn a" id="mq1">Enregistrer et arrêter</button><div style="height:10px"></div><button class="btn ghost" id="mq2">Continuer</button></div></div>`;
 $('#mq1').onclick=()=>{$('#modal').innerHTML='';clearInterval(timerId);keepAwake(false);if(Object.keys(RUN.results).length)record(true);RUN=null;render()};
 $('#mq2').onclick=()=>{$('#modal').innerHTML=''};
}

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
